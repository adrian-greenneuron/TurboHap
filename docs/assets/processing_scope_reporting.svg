<line x1="287" y1="311" x2="588.243" y2="311" stroke="#0d685e" stroke-width="7" stroke-linecap="round"/>
<circle cx="588.243" cy="311" r="6.5" fill="white" stroke="#0d685e" stroke-width="3"/>
<text x="704" y="318" font-size="21" font-weight="700" fill="#162e44" text-anchor="end">0.9942</text>
