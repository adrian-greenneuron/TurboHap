<line x1="287" y1="167" x2="571.184" y2="167" stroke="#245d80" stroke-width="7" stroke-linecap="round"/>
<circle cx="571.184" cy="167" r="6.5" fill="white" stroke="#245d80" stroke-width="3"/>
