<text x="748" y="174" font-size="20" font-weight="700" fill="#245d80" text-anchor="start">Reported</text>
<text x="30" y="269" font-size="19" font-weight="400" fill="#162e44" text-anchor="start">Chromosome 1</text>
<line x1="287" y1="263" x2="590" y2="263" stroke="#dce4e9" stroke-width="7" stroke-linecap="round"/>
