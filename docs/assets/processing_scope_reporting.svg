<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
<title id="title">Which results include cow 10?</title>
<desc id="desc">Estimated squared-correlation scores at the end of the run. The genome-wide estimate of 0.9379 passes. In chromosome scope the estimates are 0.9867 on chromosome 1, 0.9942 on chromosome 2, and 0.6667 on X. The first two pass the 0.7056 cutoff. The X record is withheld.</desc>

<rect x="0" y="0" width="960" height="470" rx="0" fill="#ffffff"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="24" y="42" font-size="29" font-weight="700" fill="#162e44" text-anchor="start">Which results include cow 10?</text>
<text x="24" y="74" font-size="18" font-weight="400" fill="#456170" text-anchor="start">At the end of the run, a second decision uses the estimated genotype quality.</text>
<text x="24" y="125" font-size="18" font-weight="700" fill="#162e44" text-anchor="start">Scope and chromosome</text>
<text x="704" y="125" font-size="18" font-weight="700" fill="#162e44" text-anchor="end">Score</text>
<text x="748" y="125" font-size="18" font-weight="700" fill="#162e44" text-anchor="start">Genotype output</text>
<rect x="16" y="141" width="928" height="55" rx="7" fill="#eaf2f7"/>
<text x="24" y="227" font-size="18" font-weight="700" fill="#0d685e" text-anchor="start">Chromosome scope</text>
<line x1="24" y1="237" x2="936" y2="237" stroke="#c7d4dc" stroke-width="1" />
<text x="30" y="173" font-size="19" font-weight="700" fill="#245d80" text-anchor="start">Genome-wide</text>
